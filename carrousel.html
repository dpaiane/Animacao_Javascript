<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animações</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        #carrossel {
            width: 600px;
            height: 300px;
            margin: 30px auto;
            overflow: hidden;
        }
        #imagem {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s;
        }
        button {
            padding: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- https://images.openai.com/static-rsc-4/9ZOmEOEINxTLee0UIa_BGlJb1-MtrwEvn_U0gqC3ZAw8Az0rotvn84CxQAiHsFlZPaS654CtCDiCP2N0yWVva5YO2w4GtD0hTHOjG4EQimvkXINwI-aJLLbvhKAfymDE7TefIVklgm-pjbyjmaxdiIBg8swiYOZF9W7AEanDTZWiSNfuFO7x4vrukX7rjTC3?purpose=fullsize -->
    <h1>Carrosel de imagens</h1>

    <div id="Carrosel">
        <img id="imagem" src="image/foto1.jpg" alt="motos velozes">
    </div>

    <button onclick="anterior()">Anterior</button>
    <button onclick="proxima()">Proxima</button>

    <script>
        // lista de imagens
        let imagens = ["image/foto1.jpg","image/foto2.jpg","image/foto3.jpg"];
        let indice = 0;

        function anterior(){
            indice--;

            if(indice < 0){
                indice = imagens.length - 1;
            }

            document.getElementById("imagem").src = imagens[indice];
        }
        function proxima(){
            indice++;

            if(indice >= imagens.length){
                indice = 0;
            }

            document.getElementById("imagem").src = imagens[indice];
        }
        setInterval(proxima, 3000);
    </script>
</body>
</html>
