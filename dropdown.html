<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }
        header {
            background-color: black;
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        button {
            padding: 10px;
            cursor: pointer;
            background-color: white;
        }
        #menu {
            background-color: black;
            display: flex;
            flex-direction: column;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        #menu a {
            text-decoration: none;
            color: white;
            padding: 15px;
        }
        #menu a:hover{
            background-color: #666;
        }
        #menu.aberto {
            max-height: 250px;
        }

    </style>
</head>
<body>
    <header>
        <h2>Minha Empresa</h2>
        <button onclick="abrirMenu()">Menu DropDown</button>
    </header>

    <nav id="menu">
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Serviços</a>
        <a href="#">Contato</a>
    </nav>

    <script>
        function abrirMenu(){
            let menu = document.getElementById("menu");

            // alterna a classe
            menu.classList.toggle("aberto");
        }
    </script>
</body>
</html>
